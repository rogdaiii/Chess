<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chess Overlay Helper</title>
  <link rel="icon" href="assets/pieces/wN.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
  <header class="top">
    <h1>Chess Overlay Helper</h1>
    <div class="top-right">
      <button type="button" id="popOut" class="hidden" title="Keep the helper in a small window that stays on top of the game">Pop out</button>
      <div class="mode-switch" role="tablist" aria-label="Helper mode">
        <button type="button" role="tab" data-mode="help">Full Help</button>
        <button type="button" role="tab" data-mode="tips">Tips &amp; Corrections</button>
      </div>
    </div>
  </header>

  <main>
    <section class="stage">
      <div class="evalbar" id="evalbar" aria-label="Evaluation">
        <div class="fill" id="evalfill"></div>
        <span id="evaltext">0.0</span>
      </div>
      <div id="boardHost" class="board-host"></div>
    </section>

    <aside class="panel">
      <section class="card coach" id="coach" aria-live="polite"></section>
      <section class="card review hidden" id="review" aria-live="polite"></section>

      <section class="card hidden" id="linesCard">
        <h2>Engine's top moves</h2>
        <ol class="lines" id="lines"></ol>
      </section>

      <section class="card" id="watchCard">
        <h2>Watch a game on your screen</h2>
        <p class="muted small">Share the window that shows the game. The helper reads the board and follows the moves. For games against bots or the computer, and for your own analysis.</p>
        <div class="row">
          <button type="button" id="watchStart" class="primary">Share game window</button>
          <button type="button" id="watchStop" class="hidden">Stop watching</button>
        </div>
        <div class="row hidden" id="watchTools">
          <button type="button" id="watchRecal">Recalibrate</button>
          <button type="button" id="watchSync">Sync from screen</button>
          <label>Side to move
            <select id="syncTurn"><option value="auto">Auto</option><option value="w">White</option><option value="b">Black</option></select>
          </label>
        </div>
        <p class="watch-status" id="watchStatus"></p>
      </section>

      <section class="card">
        <h2>Game</h2>
        <div class="row">
          <label>I play
            <select id="human">
              <option value="w">White</option>
              <option value="b">Black</option>
              <option value="both">Both sides</option>
            </select>
          </label>
          <button type="button" id="newGame" class="primary">New game</button>
        </div>
        <label class="slider" id="eloRow">Opponent strength <output id="eloOut"></output>
          <input type="range" id="elo" min="1320" max="3190" step="10">
        </label>
        <label class="slider">Analysis depth <output id="depthOut"></output>
          <input type="range" id="depth" min="8" max="20" step="1">
        </label>
        <div class="toggles">
          <label><input type="checkbox" id="optArrows"> Arrows</label>
          <label><input type="checkbox" id="optRadar"> Threat radar</label>
          <label id="autoRow"><input type="checkbox" id="optAuto"> Autopilot</label>
        </div>
        <div class="row">
          <button type="button" id="undo">Undo</button>
          <button type="button" id="flip">Flip board</button>
          <button type="button" id="copyFen">Copy FEN</button>
        </div>
        <form class="row fen" id="fenForm">
          <input type="text" id="fenInput" placeholder="Paste a FEN to set up a position" spellcheck="false" autocomplete="off">
          <button type="submit">Load</button>
        </form>
        <p class="fen-error hidden" id="fenError"></p>
      </section>

      <section class="card">
        <div class="moves-head">
          <h2>Moves</h2>
          <span class="tally" id="tally"></span>
        </div>
        <div class="moves" id="moves"></div>
      </section>
    </aside>
  </main>
  </div>

  <div class="modal hidden" id="watchModal">
    <div class="modal-box">
      <h2>Mark the board</h2>
      <canvas id="watchCanvas"></canvas>
      <p class="watch-msg" id="watchMsg"></p>
      <div class="row">
        <label class="inline">Bottom of the board is
          <span class="radios">
            <label><input type="radio" name="wbottom" value="w" checked> White</label>
            <label><input type="radio" name="wbottom" value="b"> Black</label>
          </span>
        </label>
        <button type="button" id="watchGo" class="primary" disabled>Calibrate</button>
        <button type="button" id="watchCancel">Cancel</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
